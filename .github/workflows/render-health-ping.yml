name: Render health ping

on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions: {}

concurrency:
  group: render-health-ping
  cancel-in-progress: false

jobs:
  ping:
    # Optional: no runner starts until this repository variable is configured.
    if: ${{ vars.RENDER_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Wake and check the eLeague backend
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from urllib.parse import urlparse

          url = os.environ["RENDER_HEALTH_URL"].strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc or parsed.path != "/api/health":
              raise SystemExit("Set RENDER_HEALTH_URL to https://YOUR-SERVICE.onrender.com/api/health")

          for attempt in range(3):
              try:
                  request = urllib.request.Request(url, headers={"Accept": "application/json", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=90) as response:
                      data = json.load(response)
                  if not isinstance(data, dict) or data.get("ok") is not True:
                      raise ValueError("The API did not return a healthy response")
                  print("eLeague API is awake and responding.")
                  break
              except Exception as error:
                  if attempt == 2:
                      raise SystemExit(f"Health check failed: {error}")
                  print(f"Waiting for the backend (attempt {attempt + 1}/3).")
                  time.sleep(5)
          PY
